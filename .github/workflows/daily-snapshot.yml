name: Daily Snapshot Log Entry

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC every day
  workflow_dispatch:        # allow manual run

permissions:
  contents: write

jobs:
  add-daily-row:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/google-sheet-live-dashboard-floxP
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepend today's snapshot row
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          FILE="src/pages/PageAuditLog.jsx"

          if grep -q "date:.*'${TODAY}'" "$FILE"; then
            echo "Entry for ${TODAY} already exists — skipping."
            exit 0
          fi

          # Skip if no human commits were made yesterday (the day being logged)
          YESTERDAY=$(date -u -d 'yesterday' '+%Y-%m-%d')
          HUMAN_COMMITS=$(git log --oneline \
            --after="${YESTERDAY} 00:00:00" \
            --before="${TODAY} 00:00:00" 2>/dev/null \
            | grep -v "github-actions\[bot\]" | wc -l)
          if [ "$HUMAN_COMMITS" -eq 0 ]; then
            echo "No human commits on ${YESTERDAY} — skipping snapshot."
            exit 0
          fi

          # Use python to safely insert the multiline row
          python3 - <<PYEOF
import re, sys

today = "${TODAY}"
new_row = f"""  {{
    date:        '{today}',
    fy26ARR:     null,
    fy26Cash:    null,
    cashOutDate: null,
    note:        '',
  }},"""

with open("${FILE}", "r") as f:
    content = f.read()

marker = "const DAILY_LOG = ["
idx = content.find(marker)
if idx == -1:
    print("ERROR: DAILY_LOG marker not found", file=sys.stderr)
    sys.exit(1)

insert_at = idx + len(marker)
content = content[:insert_at] + "\n" + new_row + content[insert_at:]

with open("${FILE}", "w") as f:
    f.write(content)

print(f"Added snapshot row for {today}")
PYEOF

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add src/pages/PageAuditLog.jsx
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: daily snapshot entry ${TODAY}"
          git push origin claude/google-sheet-live-dashboard-floxP
